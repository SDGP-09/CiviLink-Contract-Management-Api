spring.application.name=civilink-contract-manager
server.port=7071

spring.datasource.url=jdbc:mysql://${MYSQL_URL: localhost}:3306/civilink_db?createDatabaseIfNotExist=true
spring.datasource.username=root1
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#eurka configuration
eureka.client.service-url.defaultZone = http://${EUREKA_HOST:localhost}:8761/eureka


# Enable Hibernate DDL auto-generation
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE